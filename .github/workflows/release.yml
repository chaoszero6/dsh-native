name: Windows build & release

# Builds the Windows installers (jpackage needs a Windows host) and, for v* tags,
# attaches them to the GitHub Release of that tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform (needed to configure the shared KMP module)
        shell: bash
        continue-on-error: true
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" || "$SDKM" "platforms;android-37" || true

      - name: Package EXE + MSI
        shell: bash
        run: ./gradlew :desktopApp:packageExe :desktopApp:packageMsi --console=plain --no-configuration-cache

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-windows
          path: |
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/msi/*.msi

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/msi/*.msi
